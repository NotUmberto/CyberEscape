<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/png" href="./icons/favicon.png">
    <title>CyberEscape</title>
    <link rel="stylesheet" href="style1.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;800&display=swap" rel="stylesheet">
</head>
<body>

    <div class="sky">
        <span class="star star-one"></span>
        <span class="star star-two"></span>
        <span class="star star-three"></span>
        <span class="star star-four"></span>
        <span class="star star-five"></span>
    </div>

    <h1><b>Benvenuto a CyberEscape,</b></h1>
    <h2><b>GUARDIANO DIGITALE</b></h2>
    <div id="game-container">
        <div class="room" id="room1">
            <img src="icons/room1.jpeg" alt="Room 1">
        </div>
        <div class="room" id="room2">
            <img src="icons/room2.jpeg" alt="Room 2">
        </div>
        <div class="room" id="room3">
            <img src="icons/room3.jpeg" alt="Room 3">
        </div>
        <div class="room" id="room4">
            <img src="icons/room4.jpeg" alt="Room 4">
        </div>
        <div class="room" id="room5">
            <img src="icons/room5.jpeg" alt="Room 5">
        </div>
        <div class="room" id="bonus">
            <img src="icons/room6.jpeg" alt="BONUS ROOM">
        </div>
    </div>
    <div class="terminal" role="status">
        <div class="terminal-top">
            <span class="terminal-dot dot-red"></span>
            <span class="terminal-dot dot-yellow"></span>
            <span class="terminal-dot dot-green"></span>
            <span class="terminal-name">cyberescape@guardian:~</span>
        </div>
        <p id="escape-text"> Non hai ancora completato nessuna stanza</p>
    </div>
    
    <section id="footerSection">
        <span id="credit"> Crediti</span>
        <input type="button" value="SCAPPA!" id="escape-button">
        <input type="button" value="RESET" id="reset-button">
        <script src="script.js"></script>
    </section>
</body>
</html>
