<!DOCTYPE html>
<html lang="it">
    <head>
        <title>Room 3</title>
        <link rel="stylesheet" href="room3.css">
    </head>
    <body>
        <div class="sky">
            <span class="star star-one"></span>
            <span class="star star-two"></span>
            <span class="star star-three"></span>
            <span class="star star-four"></span>
            <span class="star star-five"></span>
        </div>
        <h1>Stanza 3: Le Chat</h1>
        <h2> Cosa fare in caso di chat private?</h2>
        <div id="chat-div">
            <div id="chat-header-div">
                <img id="user-icon" src="../../icons/user.jpg" alt="user icon">
                <span id="user-name"> Gruppo </span>
            </div>

            <img class="user-icon1" src="../../icons/user2.jpg" alt="user icon">
            <div id="mess1" class="user1">
                <span>Ragazzi, guardate cosa ho trovato online!</span>
            </div>
            <div id="mess2" class="user1">
                <img id="private-photo" src="../../icons/privacy.jpeg" alt="private photo">
                <span id="save-photo">Salva</span> 
                <span id="share-photo">Condividi</span> 
                <span id="delete-photo">Elimina</span>
                <span id="report-photo">Segnala</span>
            </div>

            <img class="user-icon2" src="../../icons/user3.jpg" alt="user icon">
            <div id="mess3" class="user2">
                <span>Ma è una foto privata! Non puoi condividerla!</span>
            </div>

            <img class="user-icon1" src="../../icons/user2.jpg" alt="user icon">
            <div id="mess4" class="user1">
                <span>Non è un problema, l'ho trovata online!</span>
            </div>

            <div id="text-box-div">
                <span id="text-box-span"> Invita a cancellare </span>
                <span id="text-box-span2"> Partecipa alla discussione </span>
                <div id="send-icon"></div>
            </div>
        </div>

        <div id="response"></div>
        <input type="button" id="home-button" value="Torna alla Home" onclick="window.location.href='../../index.html'">
        <span id="home-span"></span>
        <script src="room3.js"></script>
    </body>
</html>
