<!DOCTYPE html>
<html lang="it">
<head>
    <title>CyberEscape</title>
    <link rel="stylesheet" href="style1.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;800&display=swap" rel="stylesheet">
</head>
<body>
    <h1><b>Benvenuto a CyberEscape</b></h1>
    <div id="game-container">
        <div class="room" id="room1">
            <img src="icons/room1.jpeg" alt="Room 1">
        </div>
        <div class="room" id="room2">
            <img src="icons/room2.jpeg" alt="Room 2">
        </div>
        <div class="room" id="room3">
            <img src="icons/room3.jpeg" alt="Room 3">
        </div>
        <div class="room" id="room4">
            <img src="icons/room4.jpeg" alt="Room 4">
        </div>
        <div class="room" id="room5">
            <img src="icons/room5.jpeg" alt="Room 5">
        </div>
    </div>
    <p id="escape-text"> Non hai ancora completato nessuna stanza</p>
    <input type="button" value="SCAPPA!" id="escape-button">
    <script src="script.js"></script>
</body>
</html>
